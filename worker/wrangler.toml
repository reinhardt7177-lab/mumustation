name = "mumustation"
main = "worker.js"
compatibility_date = "2026-10-01"

# 서브도메인마다 한 줄. custom_domain = true 면 Cloudflare 가 DNS 레코드와
# 인증서를 알아서 만든다 — 대시보드에서 레코드를 손으로 만들 필요가 없다.
routes = [
  { pattern = "mumuworld.com", custom_domain = true },
  { pattern = "sosuworld.mumuworld.com", custom_domain = true },
]
